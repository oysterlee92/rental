spring:
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/rental}
        username: ${DB_USERNAME:rental}
        password: ${DB_PASSWORD:rental_local_password}

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true

    thymeleaf:
        cache: false