<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예약 요청 확인</title>
</head>
<body>
<main>
    <h1>예약 입력 화면 연결 확인</h1>
    <p>이번 회차에서는 실제 예약과 결제를 저장하지 않는다.</p>
    <dl>
        <dt>차량</dt>
        <dd th:text="${car.modelName}">차량 모델명</dd>
        <dt>예약자</dt>
        <dd th:text="${reservationForm.renterName}">예약자 이름</dd>
        <dt>대여 기간</dt>
        <dd>
            <span th:text="${reservationForm.startDate}">시작일</span>
            ~
            <span th:text="${reservationForm.endDate}">반납 예정일</span>
        </dd>
    </dl>
    <a th:href="@{/cars}">차량 검색으로 돌아가기</a>
</main>
</body>
</html>
