<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예약 생성 완료</title>
</head>
<body>
<main>
    <h1>예약이 생성됐다</h1>
    <p>
        예약 번호:
        <strong th:text="${reservationId}">예약 ID</strong>
    </p>

    <p>이번 회차에서는 예약만 저장하고 결제는 다음 회차에서 처리한다.</p>
    <a th:href="@{/cars}">차량 검색으로 돌아가기</a>
</main>
</body>
</html>
