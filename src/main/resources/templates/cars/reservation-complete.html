<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>예약 생성 완료</title>
</head>
<body>
<main>
    <h1>예약이 생성됐다</h1>
    <p>
        예약 번호:
        <strong th:text="${reservationId}">예약 ID</strong>
    </p>
    <p>현재 상태: 결제 대기</p>

    <form
            th:action="@{/reservations/{id}/simulate-payment(id=${reservationId})}"
            method="post"
    >
        <button type="submit">결제 시뮬레이션</button>
    </form>

    <a th:href="@{/cars}">차량 검색으로 돌아가기</a>
</main>
</body>
</html>
