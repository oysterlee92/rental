services:
    postgres:
        image: postgres:18
        container_name: rental-postgres
        environment:
            POSTGRES_DB: ${DB_NAME:-rental}
            POSTGRES_USER: ${DB_USERNAME:-rental}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-rental_local_password}
        ports:
            - "5433:5432"
        volumes:
            - rental-postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    rental-postgres-data: